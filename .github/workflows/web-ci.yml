name: Web CI

on:
  push:
    branches: [main, "release/**"]
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, audit, build, and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_teacher_attempt_window_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_teacher_attempt_window_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Placeholder project for the build and the mocked browser tests; no real
      # Supabase backend is contacted in CI.
      NEXT_PUBLIC_SUPABASE_URL: https://e2e-test.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_e2e_placeholder_key
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Test attempt deadline RPCs against PostgreSQL
        run: npm run test:attempt-window:db
        env:
          ATTEMPT_WINDOW_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_teacher_attempt_window_test

      - name: Typecheck
        run: npm run typecheck

      - name: Audit dependencies
        run: npm audit

      - name: Build production app
        run: npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke and mocked strict-mode tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 7
