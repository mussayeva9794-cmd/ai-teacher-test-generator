<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#951122">
<title>Mugalim AI</title>
<style>
  :root { color-scheme: light dark; --ink: #100c08; --paper: #f7f4ef; --surface: #fffdf9; --line: #e8dfd6; --muted: #756d68; --wine: #951122; }
  @media (prefers-color-scheme: dark) { :root { --ink: #f3ece6; --paper: #171113; --surface: #221a1c; --line: #3a2e31; --muted: #b3a7a2; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--paper); color: var(--ink); font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { width: min(460px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 32px 26px; text-align: center; }
  .mark { display: inline-grid; place-items: center; width: 56px; height: 56px; border-radius: 16px; background: var(--wine); color: #fff; font: 800 30px/1 Manrope, system-ui, sans-serif; }
  h1 { font-size: 1.6rem; letter-spacing: -.03em; margin: 18px 0 10px; }
  p { color: var(--muted); line-height: 1.6; margin: 0 0 22px; }
  button { border: 0; border-radius: 12px; background: var(--wine); color: #fff; font: 700 1rem/1 inherit; padding: 14px 20px; cursor: pointer; min-height: 48px; }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">M</div>
  <h1 id="title">Нет связи с интернетом</h1>
  <p id="text">Проверьте Wi-Fi или мобильный интернет. Если вы писали тест, уже сохранённые ответы не пропадут — откройте тест снова, когда связь вернётся.</p>
  <button id="retry" type="button">Попробовать снова</button>
</main>
<script>
  // Same language choice as the site: the saved cookie, otherwise the browser language.
  var texts = {
    kk: ["Интернет байланысы жоқ", "Wi-Fi немесе мобильді интернетті тексеріңіз. Тест жазып жатсаңыз, сақталған жауаптар жоғалмайды — байланыс қалпына келгенде тестті қайта ашыңыз.", "Қайталап көру"],
    en: ["No internet connection", "Check Wi-Fi or mobile data. If you were taking a test, answers already saved are not lost — open the test again when the connection is back.", "Try again"]
  };
  var match = document.cookie.match(/(?:^|; )mugalim_lang=(kk|ru|en)/);
  var lang = match ? match[1] : /^kk\b/i.test(navigator.language || "") ? "kk" : "ru";
  if (texts[lang]) {
    document.documentElement.lang = lang;
    document.getElementById("title").textContent = texts[lang][0];
    document.getElementById("text").textContent = texts[lang][1];
    document.getElementById("retry").textContent = texts[lang][2];
  }
  document.getElementById("retry").addEventListener("click", function () { location.reload(); });
  window.addEventListener("online", function () { location.reload(); });
</script>
</body>
</html>
